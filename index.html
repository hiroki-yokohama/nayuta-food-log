<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAYUTA Food Log</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 24px;
      margin-top: 30px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .description {
      color: #ddd;
      font-size: 17px;
      line-height: 1.6;
    }

    #foodPhoto {
      display: none;
    }

    .photoButton {
      display: block;
      width: 100%;
      padding: 20px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      background: #f2f2f7;
      color: #0a84ff;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    #previewArea {
      display: none;
      margin-top: 22px;
    }

    #preview {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      background: #000;
    }

    #photoStatus {
      margin-top: 12px;
      text-align: center;
      color: #30d158;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍽️ NAYUTA Food Log</h1>
    <p class="subtitle">食事写真から栄養を記録</p>

    <div class="card">

      <h2>今日の食事</h2>

      <p class="description">
        写真とナユタの判定結果を保存します。
      </p>

      <input
        type="file"
        id="foodPhoto"
        accept="image/*"
      >

      <label for="foodPhoto" class="photoButton">
        📷 写真を選ぶ
      </label>

      <div id="previewArea">

        <img
          id="preview"
          alt="選択した食事写真"
        >

        <div id="photoStatus">
          ✅ 写真を選択しました
        </div>

      </div>

    </div>

  </div>

  <script>
    const foodPhoto = document.getElementById("foodPhoto");
    const preview = document.getElementById("preview");
    const previewArea = document.getElementById("previewArea");

    foodPhoto.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        preview.src = event.target.result;
        previewArea.style.display = "block";
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
