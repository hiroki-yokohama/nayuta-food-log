<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAYUTA Food Log</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 30px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 24px;
      margin-top: 30px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .description {
      color: #ddd;
      font-size: 17px;
      line-height: 1.6;
    }

    #foodPhoto { display: none; }

    .photoButton,
    #analyzeButton {
      display: block;
      width: 100%;
      padding: 20px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .photoButton {
      background: #f2f2f7;
      color: #0a84ff;
    }

    #analyzeButton {
      background: #0a84ff;
      color: white;
    }

    #analyzeButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #previewArea {
      display: none;
      margin-top: 22px;
    }

    #preview {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 14px;
      background: #000;
    }

    #photoStatus {
      margin-top: 12px;
      text-align: center;
      color: #30d158;
      font-weight: bold;
    }

    #resultArea {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border-radius: 14px;
      background: #2c2c2e;
    }

    #foodResult {
      white-space: pre-wrap;
      line-height: 1.7;
      word-break: break-word;
    }

    #errorArea {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #3a1d1d;
      color: #ffb4b4;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🍽️ NAYUTA Food Log</h1>
    <p class="subtitle">食事写真から栄養を記録</p>

    <div class="card">
      <h2>今日の食事</h2>

      <p class="description">
        写真を選ぶと、ナユタが画像だけから食事内容とP/F/C・カロリーを推定します。
      </p>

      <input type="file" id="foodPhoto" accept="image/*">

      <label for="foodPhoto" class="photoButton">
        📷 写真を選ぶ
      </label>

      <div id="previewArea">
        <img id="preview" alt="選択した食事写真">
        <div id="photoStatus">✅ 写真を選択しました</div>
      </div>

      <button id="analyzeButton">🔍 ナユタに判定してもらう</button>

      <div id="errorArea"></div>

      <div id="resultArea">
        <h3>🤖 ナユタ判定</h3>
        <div id="foodResult">---</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://nayuta-food-api.yokohamakikaku.workers.dev/";

    const foodPhoto = document.getElementById("foodPhoto");
    const preview = document.getElementById("preview");
    const previewArea = document.getElementById("previewArea");
    const analyzeButton = document.getElementById("analyzeButton");
    const resultArea = document.getElementById("resultArea");
    const foodResult = document.getElementById("foodResult");
    const errorArea = document.getElementById("errorArea");

    let imageDataUrl = "";

    foodPhoto.addEventListener("change", function () {
      const file = this.files[0];

      resultArea.style.display = "none";
      errorArea.style.display = "none";
      imageDataUrl = "";

      if (!file) {
        previewArea.style.display = "none";
        return;
      }

      if (!file.type.startsWith("image/")) {
        alert("画像ファイルを選んでね！");
        this.value = "";
        previewArea.style.display = "none";
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        imageDataUrl = event.target.result;
        preview.src = imageDataUrl;
        previewArea.style.display = "block";
      };

      reader.onerror = function () {
        errorArea.textContent = "画像の読み込みに失敗しました。";
        errorArea.style.display = "block";
      };

      reader.readAsDataURL(file);
    });

    analyzeButton.addEventListener("click", async function () {
      if (!imageDataUrl) {
        alert("先に食事写真を選んでね！");
        return;
      }

      analyzeButton.disabled = true;
      analyzeButton.textContent = "⏳ ナユタ判定中…";
      resultArea.style.display = "block";
      foodResult.textContent = "画像を分析しています…";
      errorArea.style.display = "none";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            image: imageDataUrl,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          const detail = data?.detail ? `\n${JSON.stringify(data.detail, null, 2)}` : "";
          throw new Error((data?.error || `HTTP ${response.status}`) + detail);
        }

        foodResult.textContent = data.result || "結果を取得できませんでした";
      } catch (error) {
        resultArea.style.display = "none";
        errorArea.textContent = `判定に失敗しました。\n${error.message}`;
        errorArea.style.display = "block";
      } finally {
        analyzeButton.disabled = false;
        analyzeButton.textContent = "🔍 ナユタに判定してもらう";
      }
    });
  </script>
</body>
</html>
